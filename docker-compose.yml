services:
  romm:
    image: rommapp/romm:${ROMM_IMAGE_TAG}
    container_name: romm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/resources:/romm/resources
      - ./data/redis:/redis-data
      - ./data/library:/romm/library
      - ./data/assets:/romm/assets
      - ./config:/romm/config
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - 1panel-network
    cpus: "1.0"
    mem_limit: 1024m
    memswap_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/heartbeat > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  1panel-network:
    external: true
