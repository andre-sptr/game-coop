# Copy to config/config.yml (chmod 600, gitignored) before deploying.
# RomM 4.5+ uses this block to configure EmulatorJS Netplay & ICE servers for cross-Wi-Fi duo play.

emulatorjs:
  netplay:
    enabled: true
    ice_servers:
      - urls: "stun:stun.relay.metered.ca:80"
      - urls: "turn:global.relay.metered.ca:80"
        username: "CHANGE_ME_TURN_USERNAME"
        credential: "CHANGE_ME_TURN_PASSWORD"
      - urls: "turns:global.relay.metered.ca:443?transport=tcp"
        username: "CHANGE_ME_TURN_USERNAME"
        credential: "CHANGE_ME_TURN_PASSWORD"

# Optional Option B (self-hosted coturn on VPS, requires opening 3478/UDP+TCP & UDP relay range):
