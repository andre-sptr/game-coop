# Copy to config/config.yml (chmod 600, gitignored) before deploying, or let
# `scripts/refresh-turn.sh` generate and refresh it every 24 hours automatically.
#
# Cloudflare Realtime TURN issues short-lived credentials (max TTL: 48h / 172800s).
# Never commit real `username` or `credential` values to Git.

emulatorjs:
  netplay:
    enabled: true
    ice_servers:
      - urls: "stun:stun.cloudflare.com:3478"
      - urls: "turn:turn.cloudflare.com:3478?transport=udp"
        username: "GENERATED_BY_REFRESH_TURN_SCRIPT"
        credential: "GENERATED_BY_REFRESH_TURN_SCRIPT"
      - urls: "turn:turn.cloudflare.com:3478?transport=tcp"
        username: "GENERATED_BY_REFRESH_TURN_SCRIPT"
        credential: "GENERATED_BY_REFRESH_TURN_SCRIPT"
      - urls: "turns:turn.cloudflare.com:5349?transport=tcp"
        username: "GENERATED_BY_REFRESH_TURN_SCRIPT"
        credential: "GENERATED_BY_REFRESH_TURN_SCRIPT"

